name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  typecheck:
    name: 1/6 typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    name: 2/6 lint
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  unit:
    name: 3/6 unit + coverage
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  integration:
    name: 4/6 integration (postgres 16)
    needs: unit
    runs-on: ubuntu-latest
    # Postgres nyata, bukan pg-mem: constraint GiST dan rate limit hanya benar
    # di engine sungguhan (IDEA.md §2.3 no. 5).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: damez
          POSTGRES_PASSWORD: damez
          POSTGRES_DB: damez_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://damez:damez@127.0.0.1:5432/damez_test
      TEST_DATABASE_URL: postgresql://damez:damez@127.0.0.1:5432/damez_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Migrate from zero
        run: npm run migrate
      - name: Seed
        run: npm run seed
      - run: npm run test:integration

  e2e:
    name: 5/6 e2e (chromium)
    needs: integration
    runs-on: ubuntu-latest
    # E2E menjalankan alur booking sungguhan, jadi butuh Postgres + katalog seed.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: damez
          POSTGRES_PASSWORD: damez
          POSTGRES_DB: damez_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://damez:damez@127.0.0.1:5432/damez_test
      TEST_DATABASE_URL: postgresql://damez:damez@127.0.0.1:5432/damez_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Migrate from zero
        run: npm run migrate
      - name: Seed
        run: npm run seed
      - name: Build production bundle
        run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    name: 6/6 production build
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
